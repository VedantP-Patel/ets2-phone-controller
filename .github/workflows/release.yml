name: Build & Release ETS2 Phone Controller

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pc-plugin:
    name: Build PC Plugin DLL (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Configure & Build C++ Plugin (Release /MT)
        run: |
          cmake -S pc -B pc/build-ci -A x64 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build pc/build-ci --config Release

      - name: Verify SCS Exports & Package DLL
        shell: pwsh
        run: |
          $dll = "pc/build-ci/Release/ets2_phone_plugin.dll"
          if (-not (Test-Path $dll)) { throw "Built DLL not found at $dll" }
          $exports = dumpbin /nologo /exports $dll | Out-String
          foreach ($sym in @("scs_input_init", "scs_input_shutdown", "scs_telemetry_init", "scs_telemetry_shutdown")) {
            if ($exports -notmatch $sym) { throw "Missing SCS export: $sym" }
          }
          New-Item -ItemType Directory -Force -Path dist/pc | Out-Null
          Copy-Item $dll dist/pc/ets2_phone_plugin.dll

      - name: Upload PC Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pc-plugin-dll
          path: dist/pc/ets2_phone_plugin.dll

  build-android-apk:
    name: Test & Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Run Unit Tests & Build APK
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Stage APK Artifact
        run: |
          mkdir -p dist/android
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/android/ets2-phone-controller.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/android/ets2-phone-controller.apk

  publish-release:
    name: Publish Portable GitHub Release
    needs: [build-pc-plugin, build-android-apk]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble Portable Bundle
        run: |
          mkdir -p release-assets portable/pc/build portable/pc/scripts portable/docs
          cp artifacts/pc-plugin-dll/ets2_phone_plugin.dll release-assets/ets2_phone_plugin.dll
          cp artifacts/android-apk/ets2-phone-controller.apk release-assets/ets2-phone-controller.apk

          cp start.bat portable/
          cp README.md portable/
          cp pc/scripts/* portable/pc/scripts/
          cp docs/* portable/docs/ || true
          cp artifacts/pc-plugin-dll/ets2_phone_plugin.dll portable/pc/build/ets2_phone_plugin.dll
          cp artifacts/android-apk/ets2-phone-controller.apk portable/ets2-phone-controller.apk

          (cd portable && zip -r ../release-assets/ETS2-Phone-Controller-Portable.zip .)

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('ETS2 Phone Controller {0}', github.ref_name) || 'ETS2 Phone Controller (Latest Prebuilt Release)' }}
          make_latest: true
          generate_release_notes: true
          files: |
            release-assets/ets2_phone_plugin.dll
            release-assets/ets2-phone-controller.apk
            release-assets/ETS2-Phone-Controller-Portable.zip
